---
- name: Bootstrap server
  hosts: all
  remote_user: root
  gather_facts: false

  tasks:
    - name: Create deploy user with sudo
      ansible.builtin.user:
        name: deploy
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true

    - name: Create .ssh directory
      ansible.builtin.file:
        path: /home/deploy/.ssh
        state: directory
        owner: deploy
        group: deploy
        mode: "0700"

    - name: Add SSH key for deploy user
      ansible.builtin.copy:
        content: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
        dest: /home/deploy/.ssh/authorized_keys
        owner: deploy
        group: deploy
        mode: "0600"

    - name: Allow passwordless sudo for deploy
      ansible.builtin.copy:
        content: "deploy ALL=(ALL) NOPASSWD: ALL"
        dest: /etc/sudoers.d/deploy
        mode: "0440"
        validate: "visudo -cf %s"
